name: Build signed NEXUS INPUT release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - name: Require the existing upload key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret $name; no replacement key will be generated."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-upload.jks"
          test -s "$RUNNER_TEMP/nexus-upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nexus-upload.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platform-tools" "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test and build signed APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify signature and checksums
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/aab-signature.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature.txt"
          mkdir -p dist
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > dist/ANDROID-SHA256SUMS
          python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-input-signed-v1
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/test-results/
            dist/
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nexus-upload.jks"
