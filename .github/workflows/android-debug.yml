name: Android v1 debug and release validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/nexus-v1-finish]
  workflow_dispatch:

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android and native toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Check native boundary and module packaging tests
        run: |
          python3 scripts/check_native_boundary.py
          python3 scripts/check_architecture_boundary.py
          python3 -m unittest discover -s scripts/tests -v
          node --test scripts/tests/webui.test.js
          sh -n kernelsu-module/control.sh kernelsu-module/control-lib.sh kernelsu-module/update.sh kernelsu-module/update-lib.sh kernelsu-module/service.sh kernelsu-module/customize.sh
      - name: Debug and release regression tests, APK and AAB validation
        run: gradle --no-daemon --stacktrace -PunsignedRelease=true :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintDebug :app:lintRelease
      - name: Verify rendered Android UI evidence (not approved design goldens)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          outputs = Path("app/build/outputs")
          expected = [
              outputs / "ui-review" / f"{orientation}-{route}.png"
              for orientation in ("portrait", "landscape")
              for route in ("home", "system", "mapper")
          ]
          states = (
              "splash-portrait",
              "profiles-shipped-unverified-preset-portrait",
              "profiles-empty-games-filter-portrait",
              "devices-no-controller-portrait",
              "calibration-no-controller-portrait",
              "profile-detail-no-game-portrait",
              "profile-detail-no-game-landscape",
              "module-launcher-portrait",
              "system-panic-unconfirmed-portrait",
          )
          expected.extend(outputs / "roborazzi" / "ui-reference-pass" / f"{state}.png" for state in states)
          for capture in expected:
              if not capture.is_file():
                  raise SystemExit(f"Missing rendered UI evidence: {capture}")
              if capture.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid PNG evidence: {capture}")
          print(f"Verified {len(expected)} generated PNG files; design approval and hardware verification are not implied.")
          PY
      - name: Verify packaged identity and native libraries
        run: python3 scripts/verify_android_artifacts.py
      - name: Package canonical KernelSU ZIP
        run: python3 scripts/package_release.py
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-input-debug-v1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload explicitly unsigned release validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-input-UNSIGNED-release-validation-v1
          path: |
            app/build/outputs/apk/release/*unsigned.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload KernelSU ZIP and staged updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: nexus-input-kernelsu-v1
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports, lint and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-test-reports
          path: |
            app/build/test-results/
            app/build/reports/
            app/build/outputs/ui-review/
            app/schemas/
          if-no-files-found: warn
      - name: Upload rendered Android UI evidence (no hardware verification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-rendered-ui-evidence
          path: |
            app/build/outputs/ui-review/*.png
            app/build/outputs/roborazzi/**/*.png
          if-no-files-found: error
          retention-days: 14
