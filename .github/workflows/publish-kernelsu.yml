name: Stage one Nexus Android and KernelSU draft release

on:
  workflow_dispatch:
    inputs:
      signed_run_id:
        description: Successful signed-release run ID for this exact commit
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  stage-release:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - name: Require successful signed artifacts from this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
        run: |
          set -euo pipefail
          case "$SIGNED_RUN_ID" in ''|*[!0-9]*) echo '::error::Invalid signed run ID'; exit 1;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN_ID" > "$RUNNER_TEMP/signed-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP'])/'signed-run.json').read_text())
          assert run['head_sha'] == os.environ['GITHUB_SHA'], 'Signed artifacts must match this exact commit'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Signed workflow must pass'
          assert run['path'] == '.github/workflows/android-signed-release.yml', 'An unsigned validation run is not a signing run'
          PY
          gh run download "$SIGNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name nexus-input-signed-v1 --dir release-assets
      - name: Check shared version and stage a draft for device review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          version = dict(line.split('=',1) for line in Path('version.properties').read_text().splitlines() if '=' in line)
          assets = Path('release-assets')
          manifest = json.loads((assets/'dist/update.json').read_text())
          assert manifest['version'] == version['versionName'] and manifest['versionCode'] == int(version['versionCode'])
          archive = assets/'dist'/Path(manifest['zipUrl']).name
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['sha256'], 'Module digest mismatch'
          apk = assets/'app/build/outputs/apk/release/app-release.apk'
          aab = assets/'app/build/outputs/bundle/release/app-release.aab'
          assert apk.is_file() and aab.is_file(), 'Signed APK/AAB assets are missing'
          tag = 'v'+version['versionName']
          notes = Path(os.environ['RUNNER_TEMP'])/'release-notes.md'
          notes.write_text('NEXUS INPUT '+version['versionName']+' draft.\n\nSigned Android and KernelSU artifacts from commit '+os.environ['GITHUB_SHA']+'.\n\nHardware and Figma acceptance are not established by CI. Complete docs/DEVICE_TEST_CHECKLIST_V1.md and docs/RELEASE_V1.md before publication. The public updater manifest has not been changed.\n')
          subprocess.run(['gh','release','create',tag,str(apk),str(aab),str(archive),str(assets/'dist/update.json'),str(assets/'dist/SHA256SUMS'),str(assets/'dist/ANDROID-SHA256SUMS'),'--draft','--target',os.environ['GITHUB_SHA'],'--title','NEXUS INPUT '+version['versionName'],'--notes-file',str(notes)],check=True)
          PY
