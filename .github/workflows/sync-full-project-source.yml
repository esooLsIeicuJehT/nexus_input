name: Sync full Android project source

on:
  push:
    paths:
      - '.github/workflows/sync-full-project-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXUS INPUT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout verified Android source lineage
        uses: actions/checkout@v4
        with:
          repository: esooLsIeicuJehT/Controlyst
          ref: main
          path: .source/controlyst
          fetch-depth: 1

      - name: Import Android app and build files
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.source/controlyst"

          test -f "$SRC/app/build.gradle.kts"
          test -f "$SRC/app/src/main/AndroidManifest.xml"
          test -f "$SRC/settings.gradle.kts"
          test -d "$SRC/app/src/main/java"

          rm -rf app gradle legacy/controlyst-root-module
          cp -a "$SRC/app" ./app
          cp -a "$SRC/gradle" ./gradle

          cp "$SRC/build.gradle.kts" ./build.gradle.kts
          cp "$SRC/gradle.properties" ./gradle.properties
          cp "$SRC/settings.gradle.kts" ./settings.gradle.kts
          cp "$SRC/.gitignore" ./.gitignore
          cp "$SRC/.env.example" ./.env.example
          cp "$SRC/LICENSE" ./LICENSE
          cp "$SRC/HARDWARE_VERIFICATION_MATRIX.md" ./HARDWARE_VERIFICATION_MATRIX.md
          cp "$SRC/metadata.json" ./metadata.json

          mkdir -p legacy/controlyst-root-module
          cp -a "$SRC/downloadable_module/." legacy/controlyst-root-module/

          # Preserve the historical Android CI under a Nexus-specific name.
          cp "$SRC/.github/workflows/android.yml" .github/workflows/android-app.yml

          mkdir -p docs
          SOURCE_SHA="$(git -C "$SRC" rev-parse HEAD)"
          cat > docs/SOURCE_LINEAGE.md <<EOF
          # NEXUS INPUT source lineage

          The Android application source under \`app/\`, plus the root Gradle project files,
          was imported byte-for-byte from \`esooLsIeicuJehT/Controlyst\` at commit
          \`$SOURCE_SHA\`.

          NEXUS INPUT-specific KernelSU companion files remain under \`kernelsu-module/\`,
          release packages remain under \`releases/\`, and NEXUS release/hardening notes
          remain under \`docs/\`.

          The imported Android tree is the verified recoverable source lineage available in
          GitHub. Later NEXUS INPUT source ZIPs created outside GitHub are not represented as
          byte-identical files here unless separately committed from those original archives.
          Do not treat this lineage note as proof that every 0.6.x runtime change documented
          elsewhere in this repository is already present in the imported Android tree.
          EOF

          rm -rf .source

      - name: Commit imported project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import full Android project source lineage"
          git push origin HEAD:main
